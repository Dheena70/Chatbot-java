<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS — Personal AI Assistant</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <div class="bot-avatar" title="J.A.R.V.I.S. Core">JV</div>
      <div>
        <div class="bot-name">JARVIS</div>
        <div class="bot-status" id="botStatus"><span class="dot"></span>Online — Laptop Control Active</div>
      </div>
      <div class="voice-indicator" id="voiceIndicator" title="Audio Visualizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn" id="autoListenToggle" aria-label="Continuous Voice Mode" title="Hands-free Voice Mode: OFF (Click to enable continuous talk)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
        </button>
        <button type="button" class="header-btn" id="voiceToggle" aria-label="Toggle Voice Response" title="Jarvis Voice: ON (Click to mute)">
          <svg id="voiceIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <button type="button" class="header-btn" id="clearBtn" aria-label="Clear chat" title="Clear chat history">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
        <button type="button" class="header-btn" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <main class="chat-window" id="chatWindow">
      <div class="msg bot">
        <div class="msg-content">
          <div class="bubble">At your service, Sir. I am JARVIS, your personal AI assistant. I have full control over your Windows laptop. Speak using the microphone button or type any command to get started!</div>
          <span class="msg-time" id="welcomeTime"></span>
        </div>
      </div>
    </main>

    <div class="quick-chips" id="quickChips">
      <button type="button" class="chip chip-highlight" id="startVoiceChatBtn">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        <span>Hands-free Voice Mode</span>
      </button>
      <button type="button" class="chip" data-msg="Battery status">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="11" x2="23" y2="13"/></svg>
        <span>Battery Status</span>
      </button>
      <button type="button" class="chip" data-msg="Disk space">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
        <span>C: Drive Space</span>
      </button>
      <button type="button" class="chip" data-msg="Take screenshot">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Take Screenshot</span>
      </button>
      <button type="button" class="chip" data-msg="Open Notepad">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Open Notepad</span>
      </button>
      <button type="button" class="chip" data-msg="Open Calculator">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="12" y1="10" x2="12.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="8.01" y2="18"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="16" y1="18" x2="16.01" y2="18"/></svg>
        <span>Calculator</span>
      </button>
      <button type="button" class="chip" data-msg="Volume up">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <span>Volume Up</span>
      </button>
      <button type="button" class="chip" data-msg="Open YouTube">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>YouTube</span>
      </button>
      <button type="button" class="chip" data-msg="What can you do?">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Capabilities</span>
      </button>
      <button type="button" class="chip" data-msg="Tell me a joke">
        <svg class="chip-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <span>Tell a Joke</span>
      </button>
    </div>

    <div class="attachment-preview-bar" id="attachmentPreviewBar" style="display: none;">
      <div class="attachment-chips-list" id="attachmentChipsList"></div>
    </div>

    <div class="queue-panel" id="queuePanel" style="display: none;">
      <div class="queue-header">
        <div class="queue-title">
          <span class="queue-pulse"></span>
          <span id="queueTitle">Command Queue</span>
          <span class="queue-count" id="queueCount">0</span>
        </div>
        <button type="button" class="queue-clear-all" id="clearQueueBtn" title="Clear all queued commands">Cancel All</button>
      </div>
      <div class="queue-list" id="queueList"></div>
    </div>

    <form class="chat-input" id="chatForm" autocomplete="off">
      <div class="attach-wrapper">
        <button type="button" class="attach-btn" id="attachBtn" aria-label="Attach photos or files" title="Attach photos, files, or documents (+)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <div class="attach-menu" id="attachMenu" style="display: none;">
          <button type="button" class="attach-menu-item" data-type="image">
            <span class="attach-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </span>
            <div class="attach-menu-text">
              <span class="attach-menu-title">Photos & Images</span>
              <span class="attach-menu-desc">PNG, JPG, WebP, GIF, SVG</span>
            </div>
          </button>
          <button type="button" class="attach-menu-item" data-type="document">
            <span class="attach-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            </span>
            <div class="attach-menu-text">
              <span class="attach-menu-title">Documents</span>
              <span class="attach-menu-desc">PDF, Word, Text, CSV</span>
            </div>
          </button>
          <button type="button" class="attach-menu-item" data-type="code">
            <span class="attach-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </span>
            <div class="attach-menu-text">
              <span class="attach-menu-title">Code & Data</span>
              <span class="attach-menu-desc">Java, Python, JS, JSON</span>
            </div>
          </button>
          <button type="button" class="attach-menu-item" data-type="all">
            <span class="attach-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </span>
            <div class="attach-menu-text">
              <span class="attach-menu-title">All Files</span>
              <span class="attach-menu-desc">Browse any file from PC</span>
            </div>
          </button>
        </div>
      </div>

      <input type="file" id="fileInput" multiple style="display: none;" />

      <input type="text" id="messageInput" placeholder="Speak, type, or attach photos/files for Jarvis, Sir..." />

      <button type="button" class="mic-btn" id="micBtn" aria-label="Speak to Jarvis" title="Click to speak (Microphone)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>

      <button type="submit" id="sendBtn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
  </div>

  <!-- Fullscreen Lightbox Modal for Photo Attachments -->
  <div class="lightbox-modal" id="lightboxModal" style="display: none;">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="Fullscreen Preview" />
      <div class="lightbox-bar">
        <span id="lightboxCaption"></span>
        <button type="button" class="lightbox-close" id="lightboxClose" title="Close preview">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
