<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS — Personal AI Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <div class="bot-avatar" title="J.A.R.V.I.S. Core">JV</div>
      <div>
        <div class="bot-name">JARVIS</div>
        <div class="bot-status" id="botStatus"><span class="dot"></span>Online — Laptop Control Active</div>
      </div>
      <div class="voice-indicator" id="voiceIndicator" title="Audio Visualizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn" id="autoListenToggle" aria-label="Continuous Voice Mode" title="Hands-free Voice Mode: OFF (Click to enable continuous talk)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
        </button>
        <button type="button" class="header-btn" id="voiceToggle" aria-label="Toggle Voice Response" title="Jarvis Voice: ON (Click to mute)">
          <svg id="voiceIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <button type="button" class="header-btn" id="clearBtn" aria-label="Clear chat" title="Clear chat history">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
        <button type="button" class="header-btn" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <main class="chat-window" id="chatWindow">
      <div class="msg bot">
        <div class="msg-content">
          <div class="bubble">At your service, Sir. I am JARVIS, your personal AI assistant. I have full control over your Windows laptop. Speak using the microphone button or type any command to get started!</div>
          <span class="msg-time" id="welcomeTime"></span>
        </div>
      </div>
    </main>

    <div class="quick-chips" id="quickChips">
      <button type="button" class="chip chip-highlight" id="startVoiceChatBtn">🎙️ Hands-free Voice Mode</button>
      <button type="button" class="chip" data-msg="Battery status">🔋 Battery Status</button>
      <button type="button" class="chip" data-msg="Disk space">💾 C: Drive Space</button>
      <button type="button" class="chip" data-msg="Take screenshot">📸 Take Screenshot</button>
      <button type="button" class="chip" data-msg="Open Notepad">📝 Open Notepad</button>
      <button type="button" class="chip" data-msg="Open Calculator">🧮 Calculator</button>
      <button type="button" class="chip" data-msg="Volume up">🔊 Volume Up</button>
      <button type="button" class="chip" data-msg="Open YouTube">🎵 YouTube</button>
      <button type="button" class="chip" data-msg="What can you do?">💡 What can you do?</button>
      <button type="button" class="chip" data-msg="Tell me a joke">😄 Tell me a joke</button>
    </div>

    <form class="chat-input" id="chatForm" autocomplete="off">
      <button type="button" class="mic-btn" id="micBtn" aria-label="Speak to Jarvis" title="Click to speak (Microphone)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <input type="text" id="messageInput" placeholder="Speak or type a command for Jarvis, Sir..." required />
      <button type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
